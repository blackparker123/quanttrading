name: Nifty 100 evening scan

on:
  schedule:
    # 16:30 India Standard Time, after the NSE cash market close.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out scanner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install scanner packages
        run: python -m pip install -r requirements.txt

      - name: Scan the Nifty 100
        run: python daily_scan.py --output daily_scan.json

      - name: Refresh private user portfolios
        env:
          PORTFOLIO_GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
          PORTFOLIO_GIST_ID: ${{ secrets.PORTFOLIO_GIST_ID }}
        run: |
          if [ -n "$PORTFOLIO_GITHUB_TOKEN" ] && [ -n "$PORTFOLIO_GIST_ID" ]; then
            python portfolio_scan.py
          else
            echo "Private portfolio tracking is not configured; skipping this step."
          fi

      - name: Publish the latest scan to the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/scan-output"
          cp daily_scan.json "$RUNNER_TEMP/scan-output/daily_scan.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan daily-scan
          git rm -rf --cached . >/dev/null 2>&1 || true
          git clean -fdx
          cp "$RUNNER_TEMP/scan-output/daily_scan.json" daily_scan.json
          git add daily_scan.json
          git commit -m "Update Nifty 100 scan $(date -u +%F)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:daily-scan
